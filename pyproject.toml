[project]
name = "camp-tools"
dynamic = ["version"]
description = "Registry tooling for camp, a community-governed plugin repository for Moodle: index validation, deterministic artifact builds, source verification, and Composer metadata generation."
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
screenshots = ["Pillow>=10.0"]
archive = ["boto3>=1.34"]
# `camp tuf` and `camp rekor` (release signing and transparency, RFC 4.3).
# python-tuf 7 pins securesystemslib ~=1.0; securesystemslib only pulls
# cryptography through its `crypto` extra, and the modules import it directly.
signing = [
    "tuf>=7,<8",
    "securesystemslib[crypto]>=1.4,<2",
    "cryptography>=40",
]
# The suite imports every module, so dev carries every extra.
dev = ["pytest>=8.0", "camp-tools[signing]"]

[project.scripts]
camp = "camp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "camp.__version__"}

[tool.setuptools.packages.find]
include = ["camp*"]

[tool.setuptools.package-data]
camp = ["schema/*.json", "fonts/*", "icons/*", "standardplugins.json",
        "plugintypes.json", "directorymap.json"]
